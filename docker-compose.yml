# Uses YOUR Postgres and Kafka from .env by default:
#   docker compose up -d --build
# Bundled local Postgres + Kafka are optional (profile "local"):
#   docker compose --profile local up -d --build   (then point .env at postgres / kafka:9092)
x-app: &app
  build: .
  env_file: .env
  volumes: ["${BLOCDATA_DIR:-/blocdata}:/blocdata"]
  # Brokers/DB on the host machine? use host.docker.internal in .env (extra_hosts makes it work on Linux)
  extra_hosts: ["host.docker.internal:host-gateway"]
  restart: unless-stopped

services:
  worker:
    <<: *app
    command: python -m app.worker
    deploy: {replicas: 3}          # <= topic partitions

  api:
    <<: *app
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000 --workers 2
    ports: ["8000:8000"]

  # ---------- optional local infrastructure ----------
  postgres:
    profiles: [local]
    image: postgres:16
    environment: {POSTGRES_USER: docparser, POSTGRES_PASSWORD: docparser, POSTGRES_DB: docparser}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]

  kafka:
    profiles: [local]
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_NUM_PARTITIONS: 6
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["9092:9092"]

volumes: {pgdata: {}}
