services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: docparser, POSTGRES_PASSWORD: docparser, POSTGRES_DB: docparser}
    volumes: [pgdata:/var/lib/postgresql/data, ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro]
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U docparser"], interval: 5s, retries: 10}

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_NUM_PARTITIONS: 6
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["9092:9092"]

  worker:
    build: .
    command: python -m app.worker
    depends_on: {postgres: {condition: service_healthy}, kafka: {condition: service_started}}
    environment:
      DP__BATCH__SIZE: "1000"
      # DP__PDF__ENGINE: textract
      # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / DP__PDF__TEXTRACT__S3_BUCKET
    volumes: ["/blocdata:/blocdata:ro"]
    deploy: {replicas: 3}          # <= topic partitions

  api:
    build: .
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000 --workers 2
    depends_on: {postgres: {condition: service_healthy}}
    environment: {WEBHOOK_TOKEN: change-me}
    volumes: ["/blocdata:/blocdata"]
    ports: ["8000:8000"]

volumes: {pgdata: {}}
